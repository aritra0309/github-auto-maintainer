[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-maintainer"
version = "0.1.0"
description = "GitHub automation agent for reviews and maintenance tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.49.0",
  "fastapi>=0.115.0",
  "openai>=1.66.0",
  "httpx>=0.28.0",
  "PyJWT[crypto]>=2.10.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.8.0",
  "PyYAML>=6.0.0",
  "structlog>=25.1.0",
  "tenacity>=9.0.0",
  "uvicorn>=0.34.0",
]

[project.scripts]
github-maintainer = "github_auto_maintainer.__main__:main"

[project.optional-dependencies]
dev = [
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "types-PyYAML>=6.0.12.20250516",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.25.0",
  "pre-commit>=4.1.0",
  "respx>=0.22.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"github_auto_maintainer.prompts" = ["*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

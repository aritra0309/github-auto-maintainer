models:
  # ── Anthropic ────────────────────────────────────────────────────────────────
  - provider: anthropic
    model: claude-haiku-4-5-20251001        # lightweight; haiku 3.x retired Feb 2026
    context_window: 200000
    cost_tier: low
    suited_for:
      - triage
      - classification
      - summarization

  - provider: anthropic
    model: claude-sonnet-4-6                # near-Opus performance; strong computer use
    context_window: 1000000
    cost_tier: medium
    suited_for:
      - patch_generation
      - deep_review
      - architecture
      - agentic_workflows

  - provider: anthropic
    model: claude-opus-4-6                  # flagship; 128k output, adaptive thinking
    context_window: 1000000
    cost_tier: high
    suited_for:
      - complex_reasoning
      - long_horizon_tasks
      - enterprise_agents

  # ── OpenAI ───────────────────────────────────────────────────────────────────
  - provider: openai
    model: gpt-5.4-mini                     # replaces gpt-4.1-mini; low-latency tier
    context_window: 1000000
    cost_tier: low
    suited_for:
      - triage
      - summarization
      - quick_fixes
      - coding_subagents

  - provider: openai
    model: gpt-5.4                          # replaces gpt-4.1; frontier for professional work
    context_window: 1000000
    cost_tier: high
    suited_for:
      - patch_generation
      - deep_review
      - refactoring
      - agentic_workflows

  # ── xAI / Grok ───────────────────────────────────────────────────────────────
  - provider: grok
    model: grok-4-1-fast-non-reasoning      # budget tier; 2M ctx, no thinking overhead
    context_window: 2000000
    cost_tier: low
    suited_for:
      - triage
      - summarization
      - real_time_investigation

  - provider: grok
    model: grok-4-1-fast-reasoning          # budget tier + reasoning; same price as above
    context_window: 2000000
    cost_tier: low
    suited_for:
      - investigation
      - quick_fixes
      - chain_of_thought_tasks

  - provider: grok
    model: grok-4.20-0309-non-reasoning     # flagship; high throughput
    context_window: 2000000
    cost_tier: high
    suited_for:
      - deep_review
      - patch_generation
      - architecture

  - provider: grok
    model: grok-4.20-0309-reasoning         # flagship + thinking mode
    context_window: 2000000
    cost_tier: high
    suited_for:
      - complex_reasoning
      - investigation
      - long_horizon_tasks

  - provider: grok
    model: grok-4.20-multi-agent-0309       # multi-agent orchestration variant
    context_window: 2000000
    cost_tier: high
    suited_for:
      - agentic_workflows
      - orchestration
      - multi_step_tasks

  # ── Ollama (local / offline) ──────────────────────────────────────────────────
  - provider: ollama
    model: llama4:scout                     # MoE, multimodal, huge ctx; replaces llama3.1:8b
    context_window: 10000000
    cost_tier: low
    suited_for:
      - offline_triage
      - quick_fixes
      - local_dev
      - multimodal_tasks

  - provider: ollama
    model: qwen3-coder-next:14b             # agentic coding focus; replaces qwen2.5-coder:14b
    context_window: 128000
    cost_tier: medium
    suited_for:
      - offline_patch_generation
      - code_review
      - local_dev
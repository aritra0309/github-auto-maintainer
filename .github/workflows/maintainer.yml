name: GitHub Auto-Maintainer

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Process event
        env:
          GITHUB_APP_ID: ${{ secrets.APP_ID }}
          GITHUB_APP_PRIVATE_KEY_PATH: ${{ runner.temp }}/private-key.pem
          GITHUB_WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          # LLM provider keys — set whichever you use
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Policy controls
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          GITHUB_ALLOWED_REPOSITORIES: ${{ vars.ALLOWED_REPOSITORIES || '' }}
          GITHUB_ALLOWED_EVENTS: ${{ vars.ALLOWED_EVENTS || '' }}
          AUTO_FIX_ENABLED: ${{ vars.AUTO_FIX_ENABLED || 'false' }}
          LOG_FORMAT: json
        run: |
          # Write the private key from secrets to a temp file
          echo "${{ secrets.APP_PRIVATE_KEY }}" > "${{ runner.temp }}/private-key.pem"
          chmod 600 "${{ runner.temp }}/private-key.pem"

          # Run single-shot mode
          github-maintainer process-event --event-path "$GITHUB_EVENT_PATH"
